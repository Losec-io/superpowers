name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VER=$(jq -r .version package.json)
          if [ "$TAG" != "$PKG_VER" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG_VER"
            exit 1
          fi
          echo "VERSION=$PKG_VER" >> $GITHUB_ENV

      - name: Build release archive
        run: |
          ARCHIVE="superpowers-v${VERSION}.tar.gz"
          tar czf "$ARCHIVE" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='docs/plans' \
            --exclude='docs/superpowers/plans' \
            --exclude='docs/superpowers/specs' \
            --exclude='scripts' \
            --exclude='.github' \
            --exclude='.pre-commit-config.yaml' \
            --exclude='.version-bump.json' \
            .
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Superpowers v${{ env.VERSION }}"
          generate_release_notes: true
          files: ${{ env.ARCHIVE }}
