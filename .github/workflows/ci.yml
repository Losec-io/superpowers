name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          for f in package.json .claude-plugin/plugin.json .codex-plugin/plugin.json docs/superpowers/model-routing.json .version-bump.json; do
            echo "Checking $f..."
            jq empty "$f"
          done

      - name: Check version sync
        run: |
          PKG_VER=$(jq -r .version package.json)
          CC_VER=$(jq -r .version .claude-plugin/plugin.json)
          CODEX_VER=$(jq -r .version .codex-plugin/plugin.json)
          echo "package.json: $PKG_VER"
          echo "claude-plugin: $CC_VER"
          echo "codex-plugin: $CODEX_VER"
          if [ "$PKG_VER" != "$CC_VER" ] || [ "$PKG_VER" != "$CODEX_VER" ]; then
            echo "::error::Version drift detected!"
            exit 1
          fi
          echo "All versions in sync: $PKG_VER"

      - name: Validate skill frontmatter
        run: |
          FAIL=0
          for skill in skills/*/SKILL.md; do
            if ! head -1 "$skill" | grep -q '^---$'; then
              echo "::error file=$skill::Missing YAML frontmatter"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Validate hooks
        run: |
          jq empty hooks/hooks.json
          for hook in hooks/session-start hooks/pre-agent-model-routing hooks/stop; do
            if [ ! -f "$hook" ]; then
              echo "::error::Missing hook: $hook"
              exit 1
            fi
            head -1 "$hook" | grep -q '^#!/' || echo "::warning file=$hook::Missing shebang"
          done

      - name: Validate agent MD files
        run: |
          FAIL=0
          for agent in agents/*.md; do
            [ ! -f "$agent" ] && continue
            echo "Checking $agent..."
            if ! head -1 "$agent" | grep -q '^---$'; then
              echo "::error file=$agent::Missing YAML frontmatter"
              FAIL=1
            fi
            if ! grep -q '^name:' "$agent"; then
              echo "::error file=$agent::Missing required 'name' field in frontmatter"
              FAIL=1
            fi
            if ! grep -q '^description:' "$agent"; then
              echo "::error file=$agent::Missing required 'description' field in frontmatter"
              FAIL=1
            fi
            if ! grep -q '^tools:' "$agent"; then
              echo "::error file=$agent::Missing required 'tools' field in frontmatter"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Validate workflow scripts
        run: |
          FAIL=0
          for wf in workflows/*.js; do
            [ ! -f "$wf" ] && continue
            echo "Checking $wf..."
            if ! grep -q 'export const meta' "$wf"; then
              echo "::error file=$wf::Missing required 'export const meta' block"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Validate agent TOML files
        run: |
          FAIL=0
          for agent in agents/*.toml; do
            echo "Checking $agent..."
            if ! grep -q '^name = ' "$agent"; then
              echo "::error file=$agent::Missing required 'name' field"
              FAIL=1
            fi
            if ! grep -q '^description = ' "$agent"; then
              echo "::error file=$agent::Missing required 'description' field"
              FAIL=1
            fi
            if ! grep -q '^developer_instructions = ' "$agent"; then
              echo "::error file=$agent::Missing required 'developer_instructions' field"
              FAIL=1
            fi
          done
          exit $FAIL

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests/brainstorm-server
        run: npm ci

      - name: Run brainstorm-server tests
        working-directory: tests/brainstorm-server
        run: npm test

      - name: Validate bin scripts
        run: |
          for f in bin/*; do
            [ ! -f "$f" ] && continue
            echo "Checking $f..."
            head -1 "$f" | grep -q '^#!/' || echo "::warning file=$f::Missing shebang"
          done

  lint-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck hooks
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: hooks
          ignore_paths: run-hook.cmd
